name: Обновить расписание
on:
  schedule:
    - cron: "17 * * * *"   # каждый час
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
        env:
          TZ: Europe/Moscow
      - run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add spbu.ics
          git diff --cached --quiet || (git commit -m "Обновление расписания" && git push)
